<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (product of products; track product.id) {
      <app-product-card
        [productName]="product.name"
        [price]="product.price"
        [imageUrl]="product.imageUrl"
        (addToCart)="onAddToCart($event)">
</app-product-card>
    }
  </div>
